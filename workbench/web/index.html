  <script>try { if (localStorage.getItem('abd-foc.sidebar') === 'collapsed') document.documentElement.dataset.sidebar = 'collapsed'; const w = localStorage.getItem('abd-foc.sidebar-width'); if (w) document.documentElement.style.setProperty('--sidebar-width', w); if (localStorage.getItem('abd-foc.appearance-theme') === 'neumorphism') { const m = localStorage.getItem('abd-foc.appearance-mode'); document.documentElement.dataset.mode = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; } } catch {}</script>

      <main id="workspace" tabindex="-1"><div class="loading-state"><h1>正在载入工作台</h1><p>需要启用浏览器 JavaScript，并通过本地服务打开。</p></div></main>

  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <div id="notification-center" class="notification-center" aria-label="通知"></div>
  <aside id="notification-history" class="notification-history" aria-labelledby="notification-history-title" hidden>
    <div class="notification-history-header"><div><h2 id="notification-history-title">通知</h2><p id="notification-history-retention">当前浏览器 · 最近 100 条</p></div><button class="dialog-close" type="button" data-action="close-notification-history" aria-label="关闭通知中心">×</button></div>
    <div class="notification-history-tools" aria-label="筛选通知"><button class="button small" type="button" data-action="filter-notifications" data-filter="all" aria-pressed="true">全部</button><button class="button small" type="button" data-action="filter-notifications" data-filter="unread" aria-pressed="false">未读</button></div>
    <div id="notification-history-list" class="notification-history-list"></div>
    <div class="notification-history-footer"><button id="notification-mark-read" class="button small" type="button" data-action="read-notifications">全部已读</button><button id="notification-clear" class="button small quiet" type="button" data-action="clear-notifications">清空记录</button></div>
  </aside>
  <dialog id="notification-dialog" class="notification-dialog" aria-labelledby="notification-title">

    <div id="notification-body" class="notification-body"></div>
    <div class="dialog-footer"><button class="button primary" type="button" data-action="close-notification">知道了</button></div>
